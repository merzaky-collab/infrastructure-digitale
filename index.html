<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Réseaux Infrastructure Digitale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : une colonne de lecture, thèmes en lignes, onglets Cours / Simulation / Quiz, une simulation par thème */
:root {
  --bg: #EDF2F4;
  --surface: #FFFFFF;
  --ink: #12202B;
  --muted: #53636F;
  --line: #CFD9DE;
  --accent: #0B6E8A;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EBF1;
  --d2: #A4560F;
  --d2-soft: #F6E3CF;
  --ok: #17724B;
  --ok-soft: #DDF1E6;
  --bad: #B03626;
  --bad-soft: #F8E0DB;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1920; --surface: #15252E; --ink: #E6EEF1; --muted: #9AAAB3; --line: #2A3D47;
    --accent: #5CC0DC; --accent-ink: #0E1920; --accent-soft: #17323D;
    --d2: #E8A25F; --d2-soft: #3A2A19;
    --ok: #5FCB98; --ok-soft: #15372A; --bad: #F08A7B; --bad-soft: #3E1F1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1920; --surface: #15252E; --ink: #E6EEF1; --muted: #9AAAB3; --line: #2A3D47;
  --accent: #5CC0DC; --accent-ink: #0E1920; --accent-soft: #17323D;
  --d2: #E8A25F; --d2-soft: #3A2A19;
  --ok: #5FCB98; --ok-soft: #15372A; --bad: #F08A7B; --bad-soft: #3E1F1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.55 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font: 500 .9em var(--f-mono); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.btn {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  min-height: 50px; padding: 12px 20px; font-weight: 700; text-align: center;
}
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.ghost { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--accent); font-weight: 600; text-align: left; }
.chip { font: 500 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); }

/* Accueil */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(2rem, 8vw, 2.9rem); }
.hero p.lead { color: var(--muted); max-width: 52ch; }
.hero .btn { align-self: flex-start; }
.stats { font: 500 13px/1.4 var(--f-mono); color: var(--muted); }
.list { display: flex; flex-direction: column; border-top: 1.5px solid var(--line); }
.row {
  display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; align-items: center; gap: 12px;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 14px 2px; min-height: 68px;
}
.row .n { font: 500 13px var(--f-mono); color: var(--muted); }
.row strong { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.06rem; line-height: 1.25; }
.row small { display: block; color: var(--muted); font-size: .9rem; line-height: 1.35; margin-top: 2px; }
.row:hover strong { color: var(--accent); }

/* Fiche */
.fiche h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tab { background: none; border: 0; border-right: 1px solid var(--line); padding: 10px 6px; min-height: 48px; font-weight: 600; }
.tab:last-child { border-right: 0; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.block { display: flex; flex-direction: column; gap: 8px; }
.block h3 { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.def { font-size: 1.1rem; }
.pts { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 8px; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; }
.kws span { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .92rem; }
.tip, .reseau, .piege { border-radius: 8px; padding: 14px 16px; }
.tip { background: var(--accent-soft); }
.reseau { border: 1.5px dashed var(--accent); }
.piege { background: var(--bad-soft); }
.tip b, .reseau b, .piege b { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.scroll { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: .95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }
.frame { display: flex; min-width: 560px; }
.frame span { border-right: 1px solid var(--line); padding: 10px 6px; text-align: center; font: 500 12px/1.3 var(--f-mono); display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.frame span:last-child { border-right: 0; }
.frame small { color: var(--muted); font-size: 11px; }
.frame .a { background: var(--accent-soft); }
.frame .b { background: var(--d2-soft); }

/* Simulations */
.sim { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
svg.map { width: 100%; max-width: 520px; height: auto; display: block; margin-inline: auto; }
svg text { fill: var(--ink); font: 500 13px var(--f-mono); }
svg text.sub { fill: var(--muted); font-size: 11px; }
svg .n rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .n.on rect { stroke: var(--ok); stroke-width: 3; }
svg .n.src rect { stroke: var(--accent); stroke-width: 3; }
svg .n.waste rect { stroke: var(--d2); stroke-width: 3; stroke-dasharray: 5 3; }
svg .n.d1 rect { stroke: var(--accent); stroke-width: 2.5; }
svg .n.d2 rect { stroke: var(--d2); stroke-width: 2.5; }
svg .dev rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
svg .link { stroke: var(--line); stroke-width: 3; fill: none; }
svg .link.src, svg .link.req, svg .link.d1 { stroke: var(--accent); }
svg .link.out, svg .link.rep { stroke: var(--ok); }
svg .link.waste, svg .link.data, svg .link.d2 { stroke: var(--d2); }
svg .mk circle { fill: var(--surface); stroke-width: 2; }
svg .mk.d1 circle { stroke: var(--accent); }
svg .mk.d2 circle { stroke: var(--d2); }
svg .mk text { font-size: 11px; }
svg text.lab { font-size: 12px; }
svg text.lab.d1 { fill: var(--accent); }
svg text.lab.d2 { fill: var(--d2); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fl { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.field label { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
select { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .88rem; color: var(--muted); }
.leg i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.note { border-radius: 8px; padding: 12px 14px; background: var(--accent-soft); }
.log { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; font-size: .96rem; }
.mac { font-family: var(--f-mono); font-size: .86rem; }
.pkt { font: 500 13px/1.5 var(--f-mono); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.pkt b { color: var(--accent); }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stats2 div { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; }
.stats2 b { font: 700 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats2 span { font-size: .9rem; color: var(--muted); }
.step { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

/* Quiz */
.top { display: flex; justify-content: space-between; align-items: center; }
.count { font: 500 14px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q { font-size: clamp(1.3rem, 5vw, 1.65rem); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; min-height: 52px;
}
.opt .l { font: 500 14px/1.6 var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb { border-radius: 10px; padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fb.ok { border-color: var(--ok); }
.fb.bad { border-color: var(--bad); }
.fb b { font-family: var(--f-display); font-size: 1.05rem; }
.fb.ok b { color: var(--ok); }
.fb.bad b { color: var(--bad); }
.score { font: 700 clamp(3rem, 14vw, 4.5rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; color: var(--muted); font-weight: 600; }
.review { display: flex; flex-direction: column; gap: 14px; }
.rv { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.rv .good { color: var(--ok); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.chap { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.chap h2 { font-size: clamp(1.35rem, 5vw, 1.75rem); }
.chead { display: flex; flex-direction: column; gap: 4px; }
.cq { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.dl { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { font: 500 12px/1.6 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 460px) { .dl { grid-template-columns: 1fr; gap: 0 } .dl dd { margin-bottom: 8px } }
.ctitle { font: 700 1.2rem var(--f-display) !important; letter-spacing: 0 !important; text-transform: none !important; color: var(--ink) !important; }
input[type="text"], input[type="number"] { font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; }
.enc { border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; border: 1.5px solid var(--line); font-size: .92rem; }
.enc .hd { display: flex; flex-direction: column; gap: 2px; }
.enc .v { font: 500 12px/1.4 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.enc.data { background: var(--surface); }
.enc.tcp { background: var(--accent-soft); border-color: var(--accent); }
.enc.ip { background: var(--d2-soft); border-color: var(--d2); }
.enc.eth { background: var(--ok-soft); border-color: var(--ok); }
.map2 { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(46px, auto); gap: 6px; }
.mcell { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mcell small { font: 500 12px var(--f-mono); color: var(--muted); }
.mcell.blk { background: var(--accent-soft); justify-content: center; text-align: center; }
.mcell.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.bit { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0; }
.bit small { font: 500 11px var(--f-mono); color: var(--muted); }
.bit b { font: 700 1.4rem var(--f-display); }
.bit[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bit[aria-pressed="true"] small { color: var(--accent-ink); }
.bn { font: 500 .95rem/1.5 var(--f-mono); overflow-wrap: anywhere; }
.bn .net { color: var(--accent); font-weight: 700; }
.bn .host { color: var(--d2); }
.needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
svg .n.fail rect { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 5 3; fill: var(--bad-soft); }
svg .dev.fail rect { stroke: var(--bad); fill: var(--bad-soft); stroke-dasharray: 5 3; }
svg .link.fail { stroke: var(--bad); stroke-dasharray: 6 5; }
svg .jn { fill: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* ---------- Thème VLAN ---------- */
:root { --c1: #2F5FD0; --c1-soft: #E0E8FA; --c2: #A4560F; --c2-soft: #F6E3CF; --c3: #7A3FC2; --c3-soft: #ECE3F8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --c1: #86A6FF; --c1-soft: #1D2A4A; --c2: #E8A25F; --c2-soft: #3A2A14; --c3: #B98CFF; --c3-soft: #2A1F40; }
}
:root[data-theme="dark"] { --c1: #86A6FF; --c1-soft: #1D2A4A; --c2: #E8A25F; --c2-soft: #3A2A14; --c3: #B98CFF; --c3-soft: #2A1F40; }
svg .link.v10 { stroke: var(--c1); }
svg .link.v20 { stroke: var(--c2); }
svg .link.v30 { stroke: var(--c3); }
svg .link.dim { opacity: .3; }
.lx-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.lx-toggle { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer; }
.lx-svg { overflow-x: auto; margin-inline: -8px; }
.lx-svg svg { display: block; width: 100%; min-width: 520px; height: auto; }
.lx-hint { font-size: .9rem; }
.lx-ctrl { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.lx-ctrl .lx-wide { flex-basis: 220px; }
.lx-ctrl select { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 10px; }
.lx-panel { border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.lx-h { font-size: 1.15rem; }
.lx-t { min-width: 0; }
.lx-t th, .lx-t td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lx-tag { display: inline-block; font: 600 12px/1.5 var(--f-mono); padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); }
.lx-tag.c1 { background: var(--c1-soft); color: var(--c1); }
.lx-tag.c2 { background: var(--c2-soft); color: var(--c2); }
.lx-tag.c3 { background: var(--c3-soft); color: var(--c3); }
.lx-bad, .lx-ko { color: var(--bad); font-weight: 700; }
.lx-ok { color: var(--ok); font-weight: 700; }
.lx-console, .lx-ios { margin: 0; background: #0F1A21; color: #CFE6D6; border-radius: 10px; padding: 14px 16px; font: 500 13px/1.6 var(--f-mono); overflow-x: auto; white-space: pre; }
.lx-ios .c { color: #7F978A; }
.lx svg .lx-w { stroke: var(--muted); stroke-width: 3; fill: none; opacity: .7; }
.lx svg .lx-w.c1 { stroke: var(--c1); opacity: 1; }
.lx svg .lx-w.c2 { stroke: var(--c2); opacity: 1; }
.lx svg .lx-w.c3 { stroke: var(--c3); opacity: 1; }
.lx svg .lx-w.trunk { stroke: var(--accent); opacity: 1; }
.lx svg .lx-w.broken { stroke: var(--bad); stroke-dasharray: 7 6; opacity: 1; }
.lx svg .lx-zone { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 5; }
.lx svg text.lx-zl { font: 600 12px var(--f-mono); fill: var(--muted); letter-spacing: .06em; }
.lx svg text.lx-port { font: 500 12px var(--f-mono); fill: var(--muted); }
.lx svg text.lx-ll { font: 600 12px var(--f-body); fill: var(--muted); }
.lx svg text.lx-ll.bad, .lx svg text.lx-ns.bad { fill: var(--bad); font-weight: 700; }
.lx svg text.lx-nl { font: 700 15px var(--f-body); fill: var(--ink); }
.lx svg text.lx-ns { font: 500 12px var(--f-mono); fill: var(--muted); }
.lx svg .lx-body { fill: var(--surface); stroke: var(--ink); stroke-width: 2.2; }
.lx svg .lx-gl { stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lx svg .lx-node { cursor: pointer; }
.lx svg .lx-node:hover .lx-body { fill: var(--accent-soft); }
.lx svg .lx-node.sel .lx-body { stroke: var(--accent); stroke-width: 3.5; }
.lx svg .lx-ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.lx svg .lx-node.sel .lx-ring { opacity: .45; }
.lx svg .lx-chip.c1 { fill: var(--c1); }
.lx svg .lx-chip.c2 { fill: var(--c2); }
.lx svg .lx-chip.c3 { fill: var(--c3); }
.lx svg text.lx-ct { font: 700 11px var(--f-body); fill: var(--surface); }
.lx svg .lx-pkt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lx svg .lx-pkt.c1 { fill: var(--c1); }
.lx svg .lx-pkt.c2 { fill: var(--c2); }
.lx svg .lx-pkt.c3 { fill: var(--c3); }
.lx svg .lx-tb { fill: var(--ink); }
.lx svg text.lx-tt { font: 700 11px var(--f-mono); fill: var(--surface); }
.lx svg .lx-fail { stroke: var(--bad); stroke-width: 5; stroke-linecap: round; }
.lx svg .lx-badge { fill: var(--bad); }
.lx svg text.lx-bt { font: 800 13px var(--f-body); fill: #FFFFFF; }
.lx-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; font-size: .95rem; }
.lx-meta dt { color: var(--muted); }
.lx-meta dd { margin: 0; font-weight: 600; }
.lx-steps { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: 12px; }
.lx-steps p { margin-top: 2px; }
.lx-corr { display: flex; flex-direction: column; gap: 14px; }
.lx-corr[hidden] { display: none; }
.lx-cfg { display: flex; flex-direction: column; gap: 6px; }
.lx-cfgh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* Labs VLAN */
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.labmap { width: 100%; max-width: 640px; height: auto; display: block; margin-inline: auto; }
svg .lk { fill: none; stroke: var(--line); stroke-width: 3; }
svg .lk.v10 { stroke: var(--accent); }
svg .lk.v20 { stroke: var(--d2); }
svg .lk.v30 { stroke: var(--ok); }
svg .lk.vt { stroke: var(--ink); stroke-width: 4.5; }
svg .nd rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
svg .nd.sw rect { fill: var(--accent-soft); }
svg .nd.r rect { fill: var(--d2-soft); }
svg .nd.l3 rect { fill: var(--ok-soft); stroke-width: 3; }
svg .nd.pc.v10 rect { stroke: var(--accent); stroke-width: 3; }
svg .nd.pc.v20 rect { stroke: var(--d2); stroke-width: 3; }
svg .nd.pc.v30 rect { stroke: var(--ok); stroke-width: 3; }
svg text.nm { font: 700 13px var(--f-mono); }
svg text.sb { font: 500 10px var(--f-mono); fill: var(--muted); }
svg text.pt { font: 500 10.5px var(--f-mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
svg text.tl { font: 700 11px var(--f-mono); }
.dots { font: 500 13px var(--f-mono); letter-spacing: .12em; color: var(--accent); }
.metas { display: flex; flex-wrap: wrap; gap: 8px; }
.lsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: s; }
.lsteps > li { counter-increment: s; border-top: 1.5px solid var(--line); padding: 14px 0 0 44px; position: relative; display: flex; flex-direction: column; gap: 8px; }
.lsteps > li::before { content: counter(s); position: absolute; left: 0; top: 12px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); font: 700 15px/26px var(--f-display); text-align: center; }
.lsteps strong { font-family: var(--f-display); font-size: 1.08rem; }
details { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details[open] > summary { border-bottom: 1px solid var(--line); }
details > div, details > p { padding: 12px 14px; margin: 0; }
details .blk { display: flex; flex-direction: column; gap: 14px; }
details .blk h4 { margin: 0 0 6px; font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
pre.code { margin: 0; padding: 12px 14px; background: #0F1B22; color: #D6E9EE; border: 1px solid var(--line); font: 500 13px/1.55 var(--f-mono); overflow-x: auto; border-radius: 8px; white-space: pre; }
.row:disabled { cursor: not-allowed; }
.row:disabled strong, .row:disabled:hover strong { color: var(--muted); }
.navlab { display: flex; flex-wrap: wrap; gap: 10px; }
svg .link.blk { stroke: var(--d2); stroke-dasharray: 7 6; }
svg .mk.ok circle { stroke: var(--ok); }

<script>
(function () {
'use strict';

/* ---------- Utilitaires ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const MACS = ['AA:AA:AA:AA:AA:AA', 'BB:BB:BB:BB:BB:BB', 'CC:CC:CC:CC:CC:CC', 'DD:DD:DD:DD:DD:DD'];
const BCAST = 'FF:FF:FF:FF:FF:FF';

/* ---------- Contenu : dans chaque question, la 1re option est la bonne (l'ordre est mélangé à chaque tirage) ---------- */
const HEX16 = Array.from({ length: 16 }, (_, i) => [String(i), i.toString(2).padStart(4, '0'), i.toString(16).toUpperCase()]);
const SCEN2 = [
  { s: "Un cabinet médical a 6 PC et une imprimante à relier. Aucun VLAN et aucune supervision ne sont demandés.", o: ["Non administrable", "Administrable (niveau 2)", "Niveau 3", "Switch PoE"], a: 0, e: "Un switch non administrable suffit : on branche, ça fonctionne, sans configuration." },
  { s: "Une entreprise veut séparer la comptabilité, les RH et les invités dans trois VLAN, sur chaque étage.", o: ["Non administrable", "Administrable (niveau 2)", "Niveau 3", "Switch PoE"], a: 1, e: "Il faut créer des VLAN : un switch administrable de niveau 2 en accès." },
  { s: "Au cœur du réseau, ces trois VLAN doivent communiquer entre eux à haut débit.", o: ["Non administrable", "Administrable (niveau 2)", "Niveau 3", "Switch PoE"], a: 2, e: "Un switch de niveau 3 route entre VLAN en interne, sans routeur externe." },
  { s: "Un étage doit accueillir 10 téléphones IP et 6 bornes Wi-Fi, sans prise électrique à proximité.", o: ["Non administrable", "Administrable (niveau 2)", "Niveau 3", "Switch PoE"], a: 3, e: "Un switch PoE alimente ces équipements par le câble Ethernet." }
];
const SCEN9 = [
  { s: "Un nouveau PC doit recevoir automatiquement son adresse IP, son masque et sa passerelle.", o: ["DHCP", "DNS", "FTP", "ICMP"], a: 0, e: "DHCP attribue automatiquement la configuration IP." },
  { s: "Un utilisateur tape www.ofppt.ma. Il faut retrouver l'adresse IP du serveur.", o: ["DNS", "DHCP", "SSH", "SMTP"], a: 0, e: "DNS traduit un nom de domaine en adresse IP." },
  { s: "Un administrateur veut se connecter à distance à un switch, de façon sécurisée.", o: ["SSH", "Telnet", "HTTP", "FTP"], a: 0, e: "SSH chiffre la session, y compris le mot de passe. Telnet envoie tout en clair." },
  { s: "Un employé envoie un courriel à un collègue. Quel protocole transporte le message vers le serveur ?", o: ["SMTP", "IMAP", "DNS", "DHCP"], a: 0, e: "SMTP sert à envoyer. POP3 et IMAP servent à recevoir." },
  { s: "On veut vérifier qu'une machine répond, avec la commande ping.", o: ["ICMP", "ARP", "FTP", "SNMP"], a: 0, e: "Le ping utilise des messages ICMP Echo Request et Echo Reply." },
  { s: "Le site d'une banque doit chiffrer les échanges avec ses clients.", o: ["HTTPS", "HTTP", "Telnet", "FTP"], a: 0, e: "HTTPS (port 443) ajoute le chiffrement TLS à HTTP." }
];
const THEMES = [
{ id: 1, ch: 4, t: "Définition de la commutation", short: "Le switch, la trame et la table MAC", sim: 'hub',
  def: "La commutation consiste à acheminer des trames Ethernet d'un port à un autre à l'intérieur d'un réseau local, en s'appuyant sur les adresses MAC. Elle est assurée par le commutateur (switch), un équipement de couche 2 qui apprend où se trouve chaque machine.",
  pts: [
    "Le switch travaille en couche 2 (liaison de données) : il manipule des trames, pas des paquets IP.",
    "Il construit une table d'adresses MAC (table CAM) qui associe chaque adresse MAC à un port.",
    "Il remplace le hub : le hub répète tout sur tous les ports, le switch envoie la trame uniquement vers le port concerné.",
    "Chaque port est une liaison dédiée. En full-duplex, on émet et on reçoit en même temps, sans collision.",
    "Sans VLAN, un message de diffusion (broadcast) est quand même envoyé sur tous les ports."
  ],
  table: { h: ["", "Hub", "Switch"], r: [
    ["Couche OSI", "1 (physique)", "2 (liaison de données)"],
    ["Envoi des données", "Sur tous les ports", "Vers le port concerné"],
    ["Collisions", "Un seul domaine partagé", "Un domaine par port"],
    ["Mode de liaison", "Half-duplex", "Full-duplex possible"],
    ["Intelligence", "Aucune (simple répéteur)", "Table MAC"]
  ] },
  kw: ["Couche 2", "Trame", "Adresse MAC", "Table MAC (CAM)", "Port", "Full-duplex"],
  ana: "Le hub est un haut-parleur dans une salle : tout le monde entend tout. Le switch est un standardiste : il connaît le poste de chacun et transmet l'appel au bon poste seulement.",
  res: "Dans une salle de TP de 20 postes, un switch 24 ports relie les PC. PC1 envoie un fichier à PC2 pendant que PC3 en envoie un à PC4, sans se gêner.",
  piege: "Un switch de couche 2 ne lit pas l'adresse IP. Il décide avec l'adresse MAC de destination. Seul un switch de niveau 3 ou un routeur utilise l'IP.",
  simIntro: "Comparez ce qui se passe quand PC1 envoie une trame à PC3, avec un hub puis avec un switch dont la table MAC est déjà remplie.",
  q: [
    { q: "À quelle couche du modèle OSI travaille un switch classique ?", o: ["Couche 2 (liaison de données)", "Couche 1 (physique)", "Couche 3 (réseau)", "Couche 4 (transport)"], e: "Un switch classique lit l'en-tête Ethernet, donc la couche 2. Le hub est en couche 1, le routeur en couche 3." },
    { q: "Quelle information le switch utilise-t-il pour choisir le port de sortie ?", o: ["L'adresse MAC de destination", "L'adresse IP de destination", "Le numéro de port TCP", "Le nom de la machine"], e: "La décision se base sur l'adresse MAC de destination inscrite dans la trame, comparée à la table MAC." },
    { q: "Que contient la table MAC d'un switch ?", o: ["Des associations adresse MAC / port", "Des associations adresse IP / adresse MAC", "Des routes vers des réseaux distants", "La liste des utilisateurs connectés"], e: "La table MAC lie une adresse MAC à un port. L'association IP / MAC se trouve dans la table ARP des machines." },
    { q: "Quelle est la différence principale entre un hub et un switch ?", o: ["Le hub répète sur tous les ports, le switch envoie vers le port concerné", "Le hub est plus rapide que le switch", "Le hub possède une table MAC, pas le switch", "Le switch travaille en couche 3, le hub en couche 2"], e: "Le hub est un simple répéteur. Le switch apprend les adresses MAC et n'envoie la trame que là où c'est utile." },
    { q: "Quelle unité de données manipule un switch de couche 2 ?", o: ["La trame", "Le paquet", "Le segment", "Le message applicatif"], e: "Trame en couche 2, paquet en couche 3, segment en couche 4." },
    { q: "Sur un hub de 12 PC à 100 Mb/s, comment est répartie la bande passante ?", o: ["Elle est partagée entre toutes les machines", "Chaque PC dispose de 100 Mb/s dédiés", "Elle est doublée grâce au full-duplex", "Elle augmente avec le nombre de PC"], e: "Le hub forme un seul domaine de collision en half-duplex : les 12 machines se partagent le même débit." },
    { q: "Un stagiaire dit : « Mon switch lit l'adresse IP de destination pour envoyer la trame ». Quelle est la correction ?", o: ["Un switch de couche 2 lit l'adresse MAC. L'IP n'est utilisée que par un switch de niveau 3 ou un routeur", "C'est exact, tous les switchs lisent l'IP", "Il lit uniquement le numéro de VLAN", "Il lit le nom de domaine du destinataire"], e: "Le switch de couche 2 n'ouvre pas le paquet IP : il s'arrête à l'en-tête Ethernet." }
  ] },

{ id: 2, ch: 4, t: "Les différents types de switch", short: "Administrable, niveau 3, PoE, empilable", sim: 'pick', scen: SCEN2,
  def: "On classe les switchs selon leur capacité de gestion, leur couche de fonctionnement et leur format physique. Le bon choix dépend du besoin : un petit bureau n'a pas les mêmes exigences qu'un cœur de réseau d'entreprise.",
  pts: [
    "Non administrable (unmanaged) : on branche et ça marche, sans aucune configuration. Pour la maison ou un petit bureau.",
    "Administrable (managed) : configuré en ligne de commande (CLI, SSH) ou par interface web. Il offre VLAN, sécurité de port, STP et supervision.",
    "Niveau 3 (multilayer) : fait la commutation et le routage entre VLAN grâce à des interfaces virtuelles (SVI).",
    "PoE (Power over Ethernet) : alimente téléphones IP, caméras et bornes Wi-Fi par le câble réseau (802.3af : 15,4 W, 802.3at : 30 W, 802.3bt : 60 à 90 W).",
    "Format : fixe, empilable (plusieurs switchs vus comme un seul) ou modulaire (châssis avec cartes, pour les grands réseaux).",
    "Place dans l'architecture : accès (relie les postes), distribution (regroupe les switchs d'accès), cœur (backbone rapide)."
  ],
  table: { h: ["Type", "Usage typique", "Ce qu'il offre"], r: [
    ["Non administrable", "Maison, petit bureau", "Branchement direct, aucune configuration"],
    ["Administrable (niveau 2)", "Réseau d'accès en entreprise ou école", "VLAN, STP, sécurité de port, supervision"],
    ["Niveau 3", "Distribution et cœur", "Tout le niveau 2, plus le routage entre VLAN"],
    ["PoE", "Téléphones IP, caméras, bornes Wi-Fi", "Alimentation électrique par le câble Ethernet"],
    ["Empilable / modulaire", "Grands réseaux", "Extension du nombre de ports, administration unifiée"]
  ] },
  kw: ["Administrable", "Niveau 3", "PoE", "Empilable", "Modulaire", "Accès / distribution / cœur"],
  ana: "Un switch non administrable est une multiprise : on branche et ça marche. Un switch administrable est un tableau électrique : on décide qui est alimenté, qui est isolé et qui est surveillé.",
  res: "Dans un lycée : des switchs administrables dans chaque salle, un switch PoE pour les caméras, et un switch de niveau 3 au centre pour relier les VLAN (administration, élèves, Wi-Fi).",
  piege: "Un switch de niveau 3 route bien entre VLAN, mais il ne remplace pas toujours le routeur : l'accès à Internet (WAN) reste souvent assuré par un routeur ou un pare-feu.",
  simIntro: "Pour chaque situation, choisissez le type de switch le plus adapté.",
  q: [
    { q: "Quel switch convient à un petit bureau qui n'a besoin ni de VLAN ni de configuration ?", o: ["Un switch non administrable", "Un switch de niveau 3", "Un switch modulaire", "Un routeur"], e: "Un switch non administrable suffit : aucune configuration, coût réduit." },
    { q: "Quelle fonction est propre aux switchs administrables ?", o: ["La création de VLAN et la configuration en CLI ou par interface web", "L'alimentation des équipements en 220 V", "Le fonctionnement sans câble", "Le remplacement des cartes réseau des PC"], e: "Un switch administrable se configure : VLAN, sécurité de port, STP, supervision." },
    { q: "Que permet un switch de niveau 3 en plus d'un switch de niveau 2 ?", o: ["Router le trafic entre VLAN", "Émettre en Wi-Fi", "Remplacer le câblage", "Augmenter la longueur maximale du câble"], e: "Il combine commutation et routage : le trafic entre VLAN est routé en interne." },
    { q: "À quoi sert le PoE ?", o: ["À alimenter un équipement (téléphone IP, caméra, borne Wi-Fi) par le câble réseau", "À doubler le débit des ports", "À chiffrer les trames", "À sauvegarder la configuration"], e: "Power over Ethernet : l'alimentation passe par le câble Ethernet, sans prise électrique à proximité." },
    { q: "Que permet un switch empilable (stackable) ?", o: ["Relier plusieurs switchs pour qu'ils se comportent comme un seul équipement", "Empiler plusieurs câbles dans une seule gaine", "Router vers Internet", "Convertir la fibre en cuivre"], e: "L'empilage fait apparaître plusieurs switchs comme un seul : plus de ports, une seule administration." },
    { q: "Dans le modèle hiérarchique, quel switch relie directement les postes des utilisateurs ?", o: ["Le switch d'accès", "Le switch de cœur", "Le switch de distribution", "Le routeur de bordure"], e: "La couche accès connecte les utilisateurs. La distribution regroupe les accès, le cœur assure le transport rapide." },
    { q: "Un administrateur doit isoler des caméras IP dans un VLAN et les alimenter par le câble. Quel switch choisir ?", o: ["Un switch administrable avec PoE", "Un switch non administrable avec PoE", "Un hub", "Un switch non administrable sans PoE"], e: "Il faut deux fonctions : le PoE pour l'alimentation et l'administration pour créer le VLAN. Un switch non administrable ne sait pas créer de VLAN." }
  ] },

{ id: 3, ch: 4, t: "Le transfert de trame", short: "Apprentissage, inondation, transfert, modes", sim: 'mac',
  def: "Quand une trame arrive sur un port, le switch suit toujours le même cycle : il apprend l'adresse MAC source, cherche l'adresse MAC de destination dans sa table, puis la transmet (forward), la diffuse (flood) ou l'ignore (filter).",
  pts: [
    "Apprentissage : l'adresse MAC source est enregistrée avec le port d'arrivée. L'entrée est effacée après un temps de vieillissement (300 s par défaut sur Cisco).",
    "Destination connue : la trame sort uniquement par le port associé. C'est le transfert (forwarding).",
    "Destination inconnue ou broadcast `FF:FF:FF:FF:FF:FF` : la trame sort par tous les ports sauf celui d'arrivée. C'est l'inondation (flooding).",
    "Destination située sur le même port que la source : la trame est filtrée (non retransmise).",
    "Le switch apprend toujours l'adresse source, jamais l'adresse de destination."
  ],
  extra: 'frame',
  table: { h: ["Mode", "Principe", "Avantage", "Limite"], r: [
    ["Store-and-forward", "Reçoit toute la trame et vérifie le FCS", "Élimine les trames erronées", "Latence plus élevée"],
    ["Cut-through", "Transmet dès que la MAC de destination est lue", "Latence minimale", "Peut propager des trames corrompues"],
    ["Fragment-free", "Lit les 64 premiers octets avant d'envoyer", "Évite les fragments de collision", "Compromis entre les deux"]
  ] },
  kw: ["Apprentissage", "Inondation (flooding)", "Transfert (forwarding)", "Filtrage", "Store-and-forward", "Cut-through", "FCS", "Vieillissement"],
  ana: "Le switch est un facteur. Il note l'adresse de l'expéditeur sur chaque lettre (apprentissage). S'il connaît la boîte du destinataire, il y dépose la lettre. Sinon, il en glisse une copie dans toutes les boîtes sauf celle d'origine.",
  res: "Au premier ping entre PC1 et PC3, la table MAC est vide : le switch inonde la trame. Dès que PC3 répond, le switch connaît les deux machines et ne fait plus que du transfert direct.",
  piege: "Le switch n'envoie jamais la trame sur le port d'où elle vient, même en cas d'inondation. Et il apprend l'adresse source, pas l'adresse de destination.",
  simIntro: "Le switch démarre avec une table MAC vide. Envoyez des trames et observez l'apprentissage, l'inondation et le transfert. Essai guidé : A vers C, puis C vers A, puis A vers C.",
  q: [
    { q: "Quand le switch reçoit une trame, que enregistre-t-il dans sa table MAC ?", o: ["L'adresse MAC source avec le port d'arrivée", "L'adresse MAC de destination avec le port de sortie", "L'adresse IP source", "Le contenu de la trame"], e: "L'apprentissage porte sur l'adresse source : c'est elle qui prouve où se trouve l'expéditeur." },
    { q: "L'adresse MAC de destination n'est pas dans la table. Que fait le switch ?", o: ["Il envoie la trame sur tous les ports sauf celui d'arrivée", "Il détruit la trame", "Il la renvoie à l'expéditeur", "Il demande l'adresse au routeur"], e: "C'est l'inondation (flooding) : la trame sort partout sauf par le port d'entrée. Le destinataire, s'il existe, la reconnaîtra." },
    { q: "Quelle est l'adresse MAC de broadcast ?", o: ["FF:FF:FF:FF:FF:FF", "00:00:00:00:00:00", "255.255.255.255", "01:00:5E:00:00:01"], e: "FF:FF:FF:FF:FF:FF. 255.255.255.255 est un broadcast IP, 01:00:5E... est une plage multicast." },
    { q: "Quel mode lit toute la trame et vérifie le FCS avant de la transmettre ?", o: ["Store-and-forward", "Cut-through", "Fragment-free", "Flooding"], e: "Store-and-forward stocke la trame entière, contrôle le FCS, puis l'envoie. C'est le plus sûr." },
    { q: "Quel mode commence à transmettre dès que l'adresse MAC de destination est lue ?", o: ["Cut-through", "Store-and-forward", "Fragment-free", "Learning"], e: "Cut-through réduit la latence au minimum, mais peut propager des trames défectueuses." },
    { q: "La destination est connue, mais sur le même port que la source. Que fait le switch ?", o: ["Il filtre la trame : il ne la retransmet pas", "Il l'inonde sur tous les ports", "Il la renvoie par le même port", "Il efface sa table MAC"], e: "Les deux machines sont derrière le même port : la trame a déjà atteint le destinataire, inutile de la retransmettre." },
    { q: "À quoi sert le champ FCS d'une trame Ethernet ?", o: ["À détecter les trames corrompues", "À indiquer l'adresse de destination", "À donner la priorité de la trame", "À identifier le VLAN"], e: "Le FCS (Frame Check Sequence) est un contrôle d'erreur calculé sur la trame. S'il est faux, la trame est rejetée." },
    { q: "Le switch démarre avec une table vide. PC1 envoie une trame à PC3, puis PC3 répond. Combien d'adresses MAC le switch a-t-il apprises ?", o: ["Deux : celles de PC1 et de PC3", "Une seule : celle de PC3", "Aucune", "Trois"], e: "PC1 est appris avec sa première trame (adresse source), PC3 avec sa réponse. Chaque machine est apprise quand elle émet." }
  ] },

{ id: 4, ch: 4, t: "Les domaines de commutation", short: "Domaines de collision et de diffusion", sim: 'dom',
  def: "Un domaine de collision regroupe les équipements dont les transmissions peuvent entrer en collision. Un domaine de diffusion (broadcast) regroupe les équipements qui reçoivent un broadcast émis par l'un d'eux. Le switch segmente les collisions. Seuls les VLAN et les routeurs segmentent la diffusion.",
  pts: [
    "Hub : un seul domaine de collision et un seul domaine de diffusion pour tous ses ports.",
    "Switch : chaque port est son propre domaine de collision, mais tous les ports d'un même VLAN restent dans le même domaine de diffusion.",
    "VLAN : un switch administrable découpe le réseau en plusieurs domaines de diffusion indépendants.",
    "Routeur : chaque interface forme un domaine de diffusion. Le routeur ne transmet pas les broadcasts.",
    "Un domaine de diffusion trop grand ralentit le réseau (ARP, DHCP, etc.) : on le découpe.",
    "La détection de collision (CSMA/CD) n'existe qu'en half-duplex, par exemple derrière un hub."
  ],
  table: { h: ["Équipement", "Domaines de collision", "Domaines de diffusion"], r: [
    ["Hub", "Un seul pour tous les ports", "Un seul"],
    ["Switch", "Un par port", "Un seul (un par VLAN si VLAN)"],
    ["Routeur", "Un par interface", "Un par interface"]
  ] },
  kw: ["Domaine de collision", "Domaine de diffusion", "Broadcast", "VLAN", "Routeur", "CSMA/CD"],
  ana: "Un hub, c'est une seule ligne téléphonique partagée par tout le monde. Un switch donne une ligne privée à chacun : plus de collision. Mais une annonce au micro (broadcast) s'entend toujours dans tout le bâtiment, sauf si on le sépare en étages (VLAN).",
  res: "Un switch 24 ports avec tous les PC dans le VLAN 1 donne 24 domaines de collision et 1 domaine de diffusion. Avec 3 VLAN : toujours 24 domaines de collision, mais 3 domaines de diffusion.",
  piege: "Ajouter des switchs ne réduit pas le domaine de diffusion : tous les switchs reliés dans le même VLAN forment un seul grand domaine de diffusion.",
  simIntro: "Huit PC, quatre façons de les relier. Changez de topologie et comparez. Les pastilles numérotées sont les domaines de collision, les couleurs sont les domaines de diffusion.",
  q: [
    { q: "Combien de domaines de collision pour un hub de 8 ports avec 8 PC ?", o: ["1", "8", "2", "16"], e: "Le hub répète tout sur tous les ports : un seul domaine de collision partagé." },
    { q: "Combien de domaines de collision pour un switch de 8 ports avec 8 PC ?", o: ["8", "1", "2", "16"], e: "Chaque port du switch est son propre domaine de collision." },
    { q: "Parmi ces équipements, lequel sépare les domaines de diffusion ?", o: ["Un routeur", "Un hub", "Un switch non administrable", "Un répéteur"], e: "Le routeur ne transmet pas les broadcasts. Un switch administrable peut aussi les séparer, mais avec des VLAN." },
    { q: "Un switch administrable contient 3 VLAN actifs, avec 24 PC répartis entre eux. Combien de domaines de diffusion ?", o: ["3", "1", "24", "6"], e: "Un VLAN correspond à un domaine de diffusion." },
    { q: "Deux switchs sont reliés par un câble, tous les PC étant dans le même VLAN. Combien de domaines de diffusion ?", o: ["1", "2", "Autant que de ports", "Cela dépend des câbles"], e: "Relier des switchs agrandit le même domaine de diffusion : seul un VLAN ou un routeur le coupe." },
    { q: "Quel est l'effet d'un domaine de diffusion trop grand ?", o: ["Le trafic de broadcast ralentit le réseau", "Les adresses MAC deviennent identiques", "Les collisions disparaissent", "Le switch tombe en panne"], e: "Chaque broadcast est traité par toutes les machines du domaine : le trafic inutile augmente avec la taille." },
    { q: "Un routeur relie deux switchs de 4 PC chacun (une interface par switch). Combien de domaines de diffusion ?", o: ["2", "1", "4", "8"], e: "Chaque interface du routeur délimite un domaine de diffusion : un par switch." },
    { q: "Dans quel cas le CSMA/CD est-il réellement utilisé ?", o: ["En half-duplex, par exemple derrière un hub", "En full-duplex sur un port de switch", "Sur une liaison fibre uniquement", "Entre deux routeurs"], e: "Le full-duplex supprime les collisions : la détection n'est utile qu'en half-duplex." }
  ] },

{ id: 5, ch: 4, t: "Le protocole ARP", short: "Trouver une adresse MAC à partir d'une IP", sim: 'arp',
  def: "ARP (Address Resolution Protocol) permet de retrouver l'adresse MAC d'une machine à partir de son adresse IP, à l'intérieur d'un même réseau local. Sans l'adresse MAC, impossible de construire la trame Ethernet.",
  pts: [
    "L'hôte consulte d'abord sa table ARP (cache).",
    "Si l'adresse est absente : ARP Request en broadcast (destination `FF:FF:FF:FF:FF:FF`) pour demander « Qui a l'adresse IP X ? ».",
    "Seule la machine concernée répond, par une ARP Reply en unicast, avec son adresse MAC.",
    "L'hôte enregistre la correspondance IP / MAC dans sa table ARP, pour quelques minutes seulement.",
    "Pour une destination hors du réseau local, l'hôte résout l'adresse MAC de la passerelle, pas celle de la destination finale.",
    "Commandes : `arp -a` (Windows, Linux), `show ip arp` (Cisco).",
    "ARP n'a aucune authentification : d'où l'attaque ARP spoofing (empoisonnement de cache). Parades : Dynamic ARP Inspection, entrées statiques."
  ],
  table: { h: ["", "ARP Request", "ARP Reply"], r: [
    ["Rôle", "Demande la MAC d'une adresse IP", "Donne la MAC demandée"],
    ["Envoi", "Broadcast (FF:FF:FF:FF:FF:FF)", "Unicast vers le demandeur"],
    ["MAC cible dans le message", "00:00:00:00:00:00 (inconnue)", "MAC du demandeur"]
  ] },
  kw: ["ARP Request", "ARP Reply", "Table ARP", "Broadcast", "Passerelle", "ARP spoofing"],
  ana: "Vous connaissez le prénom d'un camarade (l'IP) mais pas sa place dans la salle (la MAC). Vous criez « Qui est Karim ? » (broadcast). Karim lève la main et vous répond directement (unicast). Vous notez sa place dans votre carnet (la table ARP).",
  res: "PC1 (192.168.1.10) veut pinger 192.168.1.20. Avant d'envoyer, il lance une ARP Request. PC2 répond, PC1 note la MAC dans sa table, puis le ping (ICMP) part.",
  piege: "L'ARP Request est en broadcast, mais l'ARP Reply est en unicast. Et ARP ne traverse pas un routeur : il ne fonctionne qu'à l'intérieur d'un domaine de diffusion.",
  simIntro: "Suivez pas à pas ce que fait PC1 avant d'envoyer son premier paquet. Comparez une destination dans le même réseau et une destination sur Internet.",
  q: [
    { q: "Quel est le rôle du protocole ARP ?", o: ["Trouver l'adresse MAC correspondant à une adresse IP", "Attribuer automatiquement des adresses IP", "Traduire un nom de domaine en adresse IP", "Chiffrer les trames"], e: "ARP associe une adresse IP connue à une adresse MAC inconnue. L'attribution d'IP, c'est DHCP, la résolution de noms, c'est DNS." },
    { q: "Quelle est l'adresse MAC de destination d'une ARP Request ?", o: ["FF:FF:FF:FF:FF:FF", "00:00:00:00:00:00", "L'adresse MAC du routeur", "L'adresse MAC de la cible"], e: "La MAC de la cible est justement inconnue : la demande part en broadcast." },
    { q: "Comment est envoyée l'ARP Reply ?", o: ["En unicast vers le demandeur", "En broadcast vers tout le réseau", "En multicast vers les routeurs", "Elle n'est jamais envoyée"], e: "La machine concernée connaît déjà la MAC du demandeur (écrite dans la requête) : elle répond directement." },
    { q: "Où l'hôte garde-t-il les correspondances IP / MAC apprises ?", o: ["Dans sa table (cache) ARP", "Dans la table MAC du switch", "Dans la table de routage", "Dans le serveur DNS"], e: "Chaque hôte tient sa propre table ARP, avec une durée de vie limitée." },
    { q: "Un PC (192.168.1.10/24) veut joindre 8.8.8.8. Quelle adresse MAC cherche-t-il avec ARP ?", o: ["Celle de la passerelle par défaut", "Celle du serveur 8.8.8.8", "Celle du switch", "Celle du serveur DNS"], e: "8.8.8.8 est hors du réseau local : la trame est adressée à la passerelle, qui fera suivre. L'IP de destination reste 8.8.8.8." },
    { q: "Quelle commande affiche la table ARP sous Windows ?", o: ["arp -a", "ipconfig /all", "tracert", "netstat -r"], e: "`arp -a` liste les correspondances IP / MAC. `netstat -r` affiche la table de routage, `ipconfig /all` la configuration des interfaces." },
    { q: "Une ARP Request peut-elle traverser un routeur ?", o: ["Non, elle reste dans le domaine de diffusion", "Oui, toujours", "Oui, si le routeur est de niveau 3", "Seulement en Wi-Fi"], e: "Un routeur ne transmet pas les broadcasts : ARP ne fonctionne qu'à l'intérieur d'un réseau local." },
    { q: "Que fait un attaquant lors d'un ARP spoofing ?", o: ["Il envoie de fausses réponses ARP pour associer sa MAC à l'IP d'une autre machine", "Il sature la table MAC avec des milliers d'adresses", "Il casse le mot de passe du switch", "Il coupe le câble réseau"], e: "ARP n'a pas d'authentification : un faux ARP Reply peut détourner le trafic. La saturation de la table MAC est une autre attaque, le MAC flooding." },
    { q: "Une ARP Request arrive sur un switch. Comment est-elle traitée ?", o: ["Elle est diffusée sur tous les ports du VLAN, sauf celui d'arrivée", "Elle est envoyée seulement vers la machine cible", "Elle est supprimée", "Elle est transmise au routeur uniquement"], e: "Destination FF:FF:FF:FF:FF:FF : le switch inonde la trame, comme tout broadcast." }
  ] },
{ id: 6, ch: 3, t: "Modèle OSI et ses couches", short: "Les 7 couches, les unités de données, l'encapsulation", sim: 'osi',
  def: "Le modèle OSI (Open Systems Interconnection), publié par l'ISO, décrit la communication réseau en 7 couches. Chaque couche a un rôle précis et ne dialogue qu'avec ses voisines. Il sert de langage commun pour comprendre, concevoir et dépanner un réseau.",
  pts: [
    "Les 7 couches, de bas en haut : Physique, Liaison de données, Réseau, Transport, Session, Présentation, Application.",
    "À l'émission, chaque couche ajoute son en-tête à la donnée (encapsulation). À la réception, chaque couche retire le sien (désencapsulation).",
    "Unités de données (PDU) : données (couches 5 à 7), segment (4), paquet (3), trame (2), bits (1).",
    "Équipements : câbles et hub (1), switch (2), routeur (3).",
    "Moyen mnémotechnique, de la couche 1 à la 7 : « Please Do Not Throw Sausage Pizza Away ».",
    "Le modèle OSI est un modèle de référence : il ne s'installe pas, il sert à raisonner."
  ],
  table: { h: ["N°", "Couche", "Unité", "Rôle", "Exemples"], r: [
    ["7", "Application", "Données", "Interface avec les logiciels, services réseau", "HTTP, SMTP, DNS"],
    ["6", "Présentation", "Données", "Format, compression, chiffrement", "JPEG, ASCII"],
    ["5", "Session", "Données", "Ouverture, maintien et fermeture des dialogues", "NetBIOS, RPC"],
    ["4", "Transport", "Segment", "Communication entre applications (ports), fiabilité", "TCP, UDP"],
    ["3", "Réseau", "Paquet", "Adressage logique et routage", "IP, ICMP, routeur"],
    ["2", "Liaison de données", "Trame", "Adressage MAC, accès au support", "Ethernet, switch"],
    ["1", "Physique", "Bits", "Transmission des signaux sur le support", "Câbles, hub, fibre, radio"]
  ] },
  kw: ["Encapsulation", "Désencapsulation", "PDU", "Segment", "Paquet", "Trame", "ISO"],
  ana: "Envoyer une lettre : vous écrivez le message (application), vous le mettez dans une enveloppe avec l'adresse (réseau), la poste la charge dans un camion (liaison) qui roule sur la route (physique). À l'arrivée, on fait le chemin inverse.",
  res: "Quand vous ouvrez un site web, la page est découpée en segments (couche 4), placée dans des paquets IP (couche 3), puis dans des trames Ethernet (couche 2) envoyées sous forme de bits sur le câble (couche 1).",
  piege: "La couche 1 est la plus basse (physique), la couche 7 la plus haute (application). Et l'utilisateur n'est pas « dans » la couche application : elle fournit des services aux logiciels.",
  simIntro: "Explorez les 7 couches, puis testez-vous : à quelle couche appartient chaque élément ?",
  q: [
    { q: "Combien de couches comporte le modèle OSI ?", o: ["7", "4", "5", "6"], e: "Le modèle OSI compte 7 couches. Le modèle TCP/IP en compte 4." },
    { q: "Quelle couche gère l'adressage logique (IP) et le choix du chemin ?", o: ["Réseau (couche 3)", "Liaison de données (couche 2)", "Transport (couche 4)", "Physique (couche 1)"], e: "La couche Réseau s'occupe des adresses IP et du routage." },
    { q: "Quelle est l'unité de données de la couche Transport ?", o: ["Le segment", "Le paquet", "La trame", "Le bit"], e: "Segment en couche 4, paquet en couche 3, trame en couche 2, bit en couche 1." },
    { q: "Un câble Ethernet est débranché. Quelle couche est en cause ?", o: ["Physique (couche 1)", "Réseau (couche 3)", "Transport (couche 4)", "Application (couche 7)"], e: "Le câble et les signaux relèvent de la couche Physique. En dépannage, on commence souvent par là." },
    { q: "Quelle couche s'occupe du format des données, de la compression et du chiffrement ?", o: ["Présentation (couche 6)", "Session (couche 5)", "Application (couche 7)", "Transport (couche 4)"], e: "La couche Présentation met les données en forme." },
    { q: "Que désigne l'encapsulation ?", o: ["L'ajout d'un en-tête par chaque couche lors de l'envoi", "Le chiffrement des données", "La compression d'un fichier", "Le retrait d'un câble"], e: "Chaque couche ajoute ses informations de contrôle (en-tête) avant de passer la donnée à la couche inférieure." },
    { q: "Quel est l'ordre correct, de la couche 1 à la couche 7 ?", o: ["Physique, Liaison, Réseau, Transport, Session, Présentation, Application", "Application, Présentation, Session, Transport, Réseau, Liaison, Physique", "Physique, Réseau, Liaison, Transport, Session, Application, Présentation", "Liaison, Physique, Réseau, Transport, Présentation, Session, Application"], e: "De bas en haut : Physique, Liaison de données, Réseau, Transport, Session, Présentation, Application." }
  ] },

{ id: 7, ch: 3, t: "Modèle TCP/IP et ses couches", short: "Les 4 couches, TCP et UDP, l'encapsulation", sim: 'encaps',
  def: "Le modèle TCP/IP est celui qui fonctionne réellement sur Internet. Il regroupe les fonctions en 4 couches : Application, Transport, Internet et Accès réseau. Son nom vient de ses deux protocoles principaux, TCP et IP.",
  pts: [
    "Application : fournit les services aux logiciels (HTTP, DNS, DHCP, SMTP, FTP).",
    "Transport : TCP (fiable, avec connexion) ou UDP (rapide, sans connexion). Les applications sont identifiées par des ports.",
    "Internet : adressage IP et routage des paquets (IP, ICMP).",
    "Accès réseau : accès au support, adresses MAC (Ethernet, Wi-Fi). Le protocole ARP fait le lien entre les adresses IP et MAC.",
    "TCP ouvre la connexion en trois temps (SYN, SYN-ACK, ACK), envoie des accusés de réception et retransmet ce qui est perdu.",
    "UDP n'a ni connexion ni retransmission : il convient à la voix, à la vidéo en direct et aux requêtes DNS."
  ],
  table: { h: ["Couche TCP/IP", "Rôle", "Protocoles", "Unité"], r: [
    ["Application", "Services aux applications", "HTTP, HTTPS, DNS, DHCP, SMTP, FTP", "Données"],
    ["Transport", "Communication entre applications (ports)", "TCP, UDP", "Segment (TCP) ou datagramme (UDP)"],
    ["Internet", "Adressage IP et routage", "IP, ICMP", "Paquet"],
    ["Accès réseau", "Accès au support, adresses MAC", "Ethernet, Wi-Fi", "Trame"]
  ] },
  kw: ["TCP", "UDP", "IP", "Port", "Encapsulation", "Connexion en trois temps"],
  ana: "TCP, c'est le courrier recommandé : accusé de réception, renvoi en cas de perte. UDP, c'est la carte postale : rapide, sans garantie.",
  res: "Un navigateur télécharge une page : TCP établit la connexion avec le serveur (port 443), IP route les paquets d'un réseau à l'autre, et Ethernet ou Wi-Fi transporte les trames sur chaque lien.",
  piege: "Certains cours présentent TCP/IP à 5 couches en séparant Physique et Liaison de données. Ici, on utilise le modèle à 4 couches. Et TCP/IP n'est pas un seul protocole : c'est une famille.",
  simIntro: "Suivez le trajet d'un message web : à chaque étape, une couche ajoute son en-tête. Passez en mode réception pour voir le chemin inverse.",
  q: [
    { q: "Combien de couches comporte le modèle TCP/IP (version à 4 couches) ?", o: ["4", "7", "5", "3"], e: "Application, Transport, Internet, Accès réseau." },
    { q: "Quelle couche TCP/IP utilise les numéros de port ?", o: ["Transport", "Internet", "Accès réseau", "Application"], e: "TCP et UDP identifient les applications par des ports : c'est la couche Transport." },
    { q: "Quel protocole est fiable et orienté connexion ?", o: ["TCP", "UDP", "IP", "ICMP"], e: "TCP établit une connexion, accuse réception et retransmet. UDP ne le fait pas." },
    { q: "Pour quel usage UDP est-il particulièrement adapté ?", o: ["La voix sur IP et la vidéo en direct", "Le transfert d'un fichier bancaire", "L'envoi de courriels", "La sauvegarde de base de données"], e: "Pour la voix et la vidéo en direct, la rapidité compte plus que la retransmission des paquets perdus." },
    { q: "Quelles sont les trois étapes de l'ouverture d'une connexion TCP ?", o: ["SYN, SYN-ACK, ACK", "ACK, SYN, FIN", "REQUEST, REPLY, DONE", "HELLO, OK, START"], e: "C'est la poignée de main en trois temps (three-way handshake)." },
    { q: "Quelle couche TCP/IP gère l'adressage IP et le routage ?", o: ["Internet", "Transport", "Accès réseau", "Application"], e: "La couche Internet utilise IP pour adresser et router les paquets." },
    { q: "Quel est l'ordre de l'encapsulation d'un message web à l'émission ?", o: ["Données, segment, paquet, trame, bits", "Bits, trame, paquet, segment, données", "Données, paquet, segment, trame, bits", "Données, trame, paquet, segment, bits"], e: "Application (données), Transport (segment), Internet (paquet), Accès réseau (trame), puis les bits sur le support." }
  ] },

{ id: 8, ch: 3, t: "Comparaison entre OSI et TCP/IP", short: "Correspondance des couches, points communs et différences", sim: 'map',
  def: "OSI et TCP/IP décrivent la même réalité avec un découpage différent. OSI est un modèle de référence en 7 couches. TCP/IP est le modèle pratique d'Internet, en 4 couches. Les trois couches hautes d'OSI correspondent à la seule couche Application de TCP/IP, et les deux couches basses à la couche Accès réseau.",
  pts: [
    "Application TCP/IP = Application + Présentation + Session (OSI 7, 6, 5).",
    "Transport = Transport (OSI 4). Internet = Réseau (OSI 3).",
    "Accès réseau = Liaison de données + Physique (OSI 2, 1).",
    "OSI a été défini avant les protocoles, comme modèle de référence. TCP/IP est né des protocoles utilisés sur ARPANET, puis a été formalisé.",
    "OSI sert à enseigner, à normaliser et à dépanner couche par couche. TCP/IP est ce qui fonctionne réellement sur les réseaux.",
    "Les deux modèles reposent sur des couches et sur l'encapsulation."
  ],
  table: { h: ["Critère", "OSI", "TCP/IP"], r: [
    ["Nombre de couches", "7", "4"],
    ["Origine", "ISO, modèle de référence", "DARPA et ARPANET, standard de fait"],
    ["Usage", "Enseignement, dépannage, normalisation", "Fonctionnement réel d'Internet"],
    ["Couches hautes", "Application, Présentation, Session séparées", "Une seule couche Application"],
    ["Couches basses", "Liaison de données et Physique séparées", "Une seule couche Accès réseau"]
  ] },
  kw: ["Correspondance", "Modèle de référence", "Standard de fait", "ISO", "DARPA"],
  ana: "OSI est le plan détaillé de l'architecte. TCP/IP est la maison réellement construite : mêmes pièces, mais certaines sont regroupées.",
  res: "Un technicien dit « problème de couche 2 » (vocabulaire OSI) pour une panne de switch ou d'adresse MAC. Le même problème se situe dans la couche Accès réseau en TCP/IP.",
  piege: "Ne mettez pas le routeur et le switch dans la même couche : le routeur travaille en couche 3 (Internet), le switch en couche 2 (Accès réseau).",
  simIntro: "Touchez une couche TCP/IP ou une couche OSI pour voir la correspondance.",
  q: [
    { q: "Quelle couche TCP/IP regroupe les couches OSI 5, 6 et 7 ?", o: ["Application", "Transport", "Internet", "Accès réseau"], e: "Session, Présentation et Application forment la couche Application de TCP/IP." },
    { q: "Quelle couche TCP/IP correspond à la couche Réseau d'OSI ?", o: ["Internet", "Transport", "Accès réseau", "Application"], e: "IP et le routage se trouvent dans la couche Internet, équivalent de la couche 3." },
    { q: "À quelle couche TCP/IP correspondent la Liaison de données et la Physique d'OSI ?", o: ["Accès réseau", "Internet", "Transport", "Application"], e: "Les deux couches basses d'OSI sont regroupées dans l'Accès réseau." },
    { q: "Quel modèle est réellement utilisé sur Internet ?", o: ["TCP/IP", "OSI", "Les deux de la même manière", "Aucun des deux"], e: "TCP/IP est le standard de fait. OSI sert surtout de modèle de référence." },
    { q: "Combien de couches ont respectivement OSI et TCP/IP ?", o: ["7 et 4", "4 et 7", "7 et 5", "5 et 4"], e: "OSI : 7 couches. TCP/IP : 4 couches dans la version la plus courante." },
    { q: "Pour quel usage le modèle OSI est-il surtout employé ?", o: ["Enseigner et dépanner couche par couche", "Remplacer TCP/IP sur Internet", "Chiffrer les données", "Attribuer les adresses IP"], e: "OSI donne un vocabulaire commun et une méthode de dépannage structurée." },
    { q: "Où se situe le protocole HTTP dans les deux modèles ?", o: ["Couche 7 OSI et couche Application TCP/IP", "Couche 4 OSI et couche Transport TCP/IP", "Couche 3 OSI et couche Internet TCP/IP", "Couche 2 OSI et couche Accès réseau TCP/IP"], e: "HTTP est un protocole applicatif : couche 7 d'OSI, couche Application de TCP/IP." }
  ] },
