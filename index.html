/* ---------- Simulation : redondance et point unique de défaillance ---------- */
function simRedund(el) {
  let arch = 'single', fault = 'none';
  const ARCH = { single: "Sans redondance", links: "Liens doublés", dual: "Routeurs doublés" };
  const FAULT = { none: "Aucune panne", cable: "Câble coupé", router: "Routeur R1 en panne", switch: "Switch en panne" };
  const EXTRA = {
    single: "Matériel en plus : aucun. Une seule chaîne PC, switch, routeur, Internet.",
    links: "Matériel en plus : un câble entre le switch et R1.",
    dual: "Matériel en plus : un routeur R2 et deux câbles. Le coût augmente."
  };
  function message(ok, viaR2) {
    if (fault === 'none') return arch === 'single' ? "Tout fonctionne, mais chaque élément de la chaîne est un point unique de défaillance." : arch === 'links' ? "Tout fonctionne. Le second câble ne sert que si le premier tombe." : "Tout fonctionne. R2 reste en secours et prend le relais si R1 tombe.";
    if (fault === 'cable') return arch === 'single' ? "Le câble est coupé et il n'y a pas d'autre chemin : le PC perd Internet." : arch === 'links' ? "Un câble est coupé, mais le second prend le relais : personne ne s'en aperçoit." : "Le lien vers R1 est coupé : le trafic passe par R2.";
    if (fault === 'router') return arch === 'dual' ? "R1 est en panne : R2 prend le relais." : arch === 'links' ? "R1 est en panne et il est seul : tout s'arrête. Doubler le câble ne suffisait pas, il fallait doubler le routeur." : "R1 est en panne et il est seul : tout s'arrête.";
    return "Le switch est en panne : il reste un point unique de défaillance dans les trois architectures. Il faut aussi le doubler, avec des liens redondants entre switchs gérés par STP.";
  }
  function draw() {
    const dual = arch === 'dual', links2 = arch === 'links';
    const swUp = fault !== 'switch', r1Up = fault !== 'router', cut = fault === 'cable';
    const viaR1 = swUp && r1Up && (!cut || links2);
    const viaR2 = swUp && dual && !viaR1;
    const ok = viaR1 || viaR2;
    const PC = [50, 125], SW = [150, 125], NET = [420, 125], R1 = dual ? [290, 62] : [290, 125], R2 = [290, 188];
    let l = '', n = '', mark = '';
    l += lineSVG(PC[0], PC[1], SW[0], SW[1], ok ? 'out' : '');
    if (links2) {
      l += lineSVG(SW[0], SW[1] - 6, R1[0], R1[1] - 6, cut ? 'fail' : (viaR1 ? 'out' : ''));
      l += lineSVG(SW[0], SW[1] + 6, R1[0], R1[1] + 6, cut && viaR1 ? 'out' : '');
    } else {
      l += lineSVG(SW[0], SW[1], R1[0], R1[1], cut ? 'fail' : (viaR1 ? 'out' : ''));
    }
    l += lineSVG(R1[0], R1[1], NET[0], NET[1], viaR1 ? 'out' : '');
    if (dual) {
      l += lineSVG(SW[0], SW[1], R2[0], R2[1], viaR2 ? 'out' : '');
      l += lineSVG(R2[0], R2[1], NET[0], NET[1], viaR2 ? 'out' : '');
    }
    if (cut) {
      const my = (SW[1] + R1[1]) / 2 - (links2 ? 6 : 0);
      mark = `<text x="${(SW[0] + R1[0]) / 2}" y="${my + 6}" text-anchor="middle" style="fill:var(--bad);font-size:18px">✕</text>`;
    }
    n += nodeSVG(PC[0], PC[1], 'PC', '', ok ? 'on' : 'fail', 56, 34);
    n += nodeSVG(SW[0], SW[1], 'SW', swUp ? '' : 'en panne', swUp ? (ok ? 'on' : '') : 'fail', 64, 40);
    n += nodeSVG(R1[0], R1[1], 'R1', r1Up ? '' : 'en panne', r1Up ? (viaR1 ? 'on' : '') : 'fail', 70, 40);
    if (dual) n += nodeSVG(R2[0], R2[1], 'R2', viaR2 ? 'relais' : 'secours', viaR2 ? 'on' : '', 70, 40);
    n += nodeSVG(NET[0], NET[1], 'Internet', '', ok ? 'on' : '', 76, 34);
    el.innerHTML = `<div class="sim">
      <div class="seg" role="group" aria-label="Architecture">${Object.keys(ARCH).map(k => `<button data-s="arch" data-v="${k}" aria-pressed="${k === arch}">${ARCH[k]}</button>`).join('')}</div>
      <svg class="map" viewBox="0 0 480 240" role="img" aria-label="Architecture ${ARCH[arch]}, ${FAULT[fault]}">${l}${mark}${n}</svg>
      ${legend([['--ok', "Chemin utilisé"], ['--bad', "Panne"], ['--line', "Disponible, inutilisé"]])}
      <div class="seg" role="group" aria-label="Panne">${Object.keys(FAULT).map(k => `<button data-s="fault" data-v="${k}" aria-pressed="${k === fault}">${FAULT[k]}</button>`).join('')}</div>
      <div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? "Internet joignable." : "Internet coupé."}</b><p>${message(ok, viaR2)}</p></div>
      <p class="muted">${EXTRA[arch]}</p></div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'arch') arch = b.dataset.v; else fault = b.dataset.v;
    draw();
  });
  draw();
}

/* ---------- Simulation : STP, trois switchs en triangle ---------- */
function simStp(el) {
  let mode = 'stp', cut = -1, low = 'none';
  const NAMES = ['SW1', 'SW2', 'SW3'];
  const POS = { SW1: [240, 48], SW2: [95, 190], SW3: [385, 190] };
  const MACN = { SW1: 1, SW2: 2, SW3: 3 };
  const LINKS = [['SW1', 'SW2'], ['SW1', 'SW3'], ['SW2', 'SW3']];
  const CUTS = ["Aucune panne", "Lien SW1–SW2 coupé", "Lien SW1–SW3 coupé", "Lien SW2–SW3 coupé"];
  const cmpArr = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; };
  const bid = n => [n === low ? 4096 : 32768, MACN[n]];
  function compute(c) {
    let root = NAMES[0];
    NAMES.forEach(n => { if (cmpArr(bid(n), bid(root)) < 0) root = n; });
    const cost = {}; NAMES.forEach(n => { cost[n] = n === root ? 0 : 99; });
    for (let k = 0; k < 3; k++) LINKS.forEach((lk, i) => {
      if (i === c) return;
      const a = lk[0], b = lk[1];
      if (cost[a] + 4 < cost[b]) cost[b] = cost[a] + 4;
      if (cost[b] + 4 < cost[a]) cost[a] = cost[b] + 4;
    });
    const rp = {};
    NAMES.forEach(n => {
      if (n === root) return;
      let bi = -1, bk = null;
      LINKS.forEach((lk, i) => {
        if (i === c || lk.indexOf(n) < 0) return;
        const m = lk[0] === n ? lk[1] : lk[0];
        const key = [cost[m] + 4, bid(m)[0], bid(m)[1], i];
        if (bk === null || cmpArr(key, bk) < 0) { bk = key; bi = i; }
      });
      rp[n] = bi;
    });
    const ports = LINKS.map((lk, i) => {
      if (i === c) return null;
      const a = lk[0], b = lk[1];
      const desig = cmpArr([cost[a], bid(a)[0], bid(a)[1]], [cost[b], bid(b)[0], bid(b)[1]]) < 0 ? a : b;
      const st = {};
      lk.forEach(n => { st[n] = rp[n] === i ? 'root' : (n === desig ? 'designated' : 'blocked'); });
      return st;
    });
    return { root, cost, rp, ports };
  }
  function draw() {
    const st = compute(cut), base = compute(-1);
    let l = '', mk = '', n = '', loop = '';
    LINKS.forEach((lk, i) => {
      const A = POS[lk[0]], B = POS[lk[1]];
      let c;
      if (i === cut) c = 'fail';
      else if (mode === 'nostp') c = cut === -1 ? 'waste' : 'out';
      else c = (st.ports[i][lk[0]] === 'blocked' || st.ports[i][lk[1]] === 'blocked') ? 'blk' : 'req';
      l += lineSVG(A[0], A[1], B[0], B[1], c);
      if (i === cut) l += `<text x="${(A[0] + B[0]) / 2}" y="${(A[1] + B[1]) / 2 + 6}" text-anchor="middle" style="fill:var(--bad);font-size:18px">✕</text>`;
      if (mode === 'stp' && i !== cut) lk.forEach((nm, e) => {
        const P = POS[nm], Q = POS[lk[1 - e]], dx = Q[0] - P[0], dy = Q[1] - P[1], len = Math.sqrt(dx * dx + dy * dy);
        const x = (P[0] + dx / len * 70).toFixed(1), y = (P[1] + dy / len * 70).toFixed(1), s = st.ports[i][nm];
        mk += `<g class="mk ${s === 'root' ? 'ok' : s === 'blocked' ? 'd2' : 'd1'}"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle">${s === 'root' ? 'R' : s === 'blocked' ? 'B' : 'D'}</text></g>`;
      });
    });
    if (mode === 'nostp' && cut === -1) {
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const path = `M${POS.SW1} L${POS.SW3} L${POS.SW2} Z`;
      if (reduce) NAMES.forEach(nm => { loop += `<circle cx="${POS[nm][0]}" cy="${POS[nm][1]}" r="6" style="fill:var(--d2)"/>`; });
      else [0, -0.8, -1.6].forEach(b => { loop += `<circle r="6" style="fill:var(--d2)"><animateMotion dur="2.4s" begin="${b}s" repeatCount="indefinite" path="${path}"/></circle>`; });
    }
    NAMES.forEach(nm => {
      const P = POS[nm], isRoot = mode === 'stp' && nm === st.root;
      n += nodeSVG(P[0], P[1], nm, `${nm === low ? 4096 : 32768} · :0${MACN[nm]}`, isRoot ? 'on' : '', 100, 46);
      if (isRoot) n += `<text x="${P[0]}" y="${nm === 'SW1' ? P[1] - 32 : P[1] + 40}" text-anchor="middle" style="fill:var(--ok);font-size:12px;font-weight:700">RACINE</text>`;
    });
    let info = '';
    if (mode === 'nostp') {
      info = cut === -1
        ? `<div class="fb bad"><b>Tempête de diffusion.</b><p>Les trois liens sont actifs : c'est une boucle. Une trame de diffusion est recopiée par chaque switch, tourne sans fin et se multiplie. En quelques secondes, le réseau est saturé.</p></div>`
        : `<div class="fb ok"><b>Pas de boucle, mais pas de secours.</b><p>Un lien est coupé : les switchs forment une ligne. Le réseau fonctionne, mais une deuxième panne le coupera en deux. Activez STP pour avoir la redondance sans la boucle.</p></div>`;
    } else {
      const log = [];
      log.push(low === 'none' ? `Élection : toutes les priorités valent 32768, donc la plus petite adresse MAC gagne. ${st.root} devient le pont racine.` : `Élection : ${low} a la priorité la plus basse (4096). Il devient le pont racine.`);
      NAMES.forEach(nm => {
        if (nm === st.root) return;
        const lk = LINKS[st.rp[nm]], other = lk[0] === nm ? lk[1] : lk[0];
        log.push(`${nm} : port racine (R) vers ${other}, coût total vers la racine : ${st.cost[nm]}.`);
      });
      LINKS.forEach((lk, i) => {
        if (i === cut) return;
        lk.forEach(nm => { if (st.ports[i][nm] === 'blocked') log.push(`Lien ${lk[0]}–${lk[1]} : le port de ${nm} est bloqué (B). Il évite la boucle et reste prêt en secours.`); });
      });
      if (cut >= 0) {
        const cl = LINKS[cut], was = base.ports[cut];
        const wasBlocked = was[cl[0]] === 'blocked' || was[cl[1]] === 'blocked';
        log.push(wasBlocked
          ? `Le lien coupé ${cl[0]}–${cl[1]} était justement le lien bloqué : personne ne s'en aperçoit.`
          : `Le lien ${cl[0]}–${cl[1]} est coupé. STP recalcule l'arbre et réactive le port qui était bloqué : Blocking, Listening, Learning, puis Forwarding. Comptez 30 à 50 s en STP classique, 1 à 2 s en RSTP.`);
      }
      info = `<ol class="log">${log.map(x => `<li>${x}</li>`).join('')}</ol>`;
    }
    el.innerHTML = `<div class="sim">
      <div class="seg" role="group" aria-label="Mode"><button data-s="mode" data-v="nostp" aria-pressed="${mode === 'nostp'}">Sans STP</button><button data-s="mode" data-v="stp" aria-pressed="${mode === 'stp'}">Avec STP</button></div>
      <svg class="map" viewBox="0 0 480 250" role="img" aria-label="Trois switchs en triangle">${l}${loop}${mk}${n}</svg>
      <div class="leg"><span><b style="color:var(--ok)">R</b> port racine</span><span><b style="color:var(--accent)">D</b> port désigné</span><span><b style="color:var(--d2)">B</b> port bloqué</span><span>Sous chaque nom : priorité · fin de l'adresse MAC</span></div>
      <div class="seg" role="group" aria-label="Panne">${CUTS.map((t, i) => `<button data-s="cut" data-v="${i - 1}" aria-pressed="${cut === i - 1}">${t}</button>`).join('')}</div>
      <div class="fl"><div class="field"><label for="stp-low">Priorité 4096 pour</label><select id="stp-low"><option value="none"${low === 'none' ? ' selected' : ''}>Personne (32768 partout)</option>${NAMES.map(x => `<option value="${x}"${low === x ? ' selected' : ''}>${x}</option>`).join('')}</select></div></div>
      ${info}</div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'mode') mode = b.dataset.v; else cut = +b.dataset.v;
    draw();
  });
  el.addEventListener('change', e => { if (e.target.id === 'stp-low') { low = e.target.value; draw(); } });
  draw();
}

/* ---------- Simulation : VRRP, bascule Master et Backup ---------- */
function simVrrp(el) {
  let step = 0, pre = true;
  const TITLES = ["1. Fonctionnement normal", "2. R1 tombe en panne", "3. R2 devient Master", "4. R1 revient"];
  function roles() {
    if (step === 0) return { r1: 'master', r2: 'backup', act: 'r1' };
    if (step === 1) return { r1: 'down', r2: 'wait', act: null };
    if (step === 2) return { r1: 'down', r2: 'master', act: 'r2' };
    return pre ? { r1: 'master', r2: 'backup', act: 'r1' } : { r1: 'backup', r2: 'master', act: 'r2' };
  }
  const LAB = { master: "Master", backup: "Backup", down: "en panne", wait: "attend…" };
  const CLS = { master: 'on', backup: 'd1', down: 'fail', wait: 'd1' };
  function body() {
    if (step === 0) return "R1 (priorité 110) est Master : il possède l'IP virtuelle et répond aux PC. Il envoie une annonce VRRP chaque seconde vers 224.0.0.18. R2 (priorité 100) est Backup : il écoute et ne route rien.";
    if (step === 1) return "Plus aucune annonce n'arrive. R2 attend, puis déclare R1 perdu après environ 3 secondes (3 annonces manquées). Pendant ce court délai, les paquets des PC vers 192.168.1.1 restent sans réponse.";
    if (step === 2) return "R2 prend l'IP virtuelle et la MAC virtuelle, puis envoie un ARP gratuit pour que le switch apprenne son port. Les PC n'ont rien changé : même passerelle, même MAC dans leur table ARP.";
    return pre
      ? "R1 revient avec la priorité 110, supérieure à 100 : il reprend le rôle de Master (préemption activée). R2 repasse Backup. Une courte perturbation est possible pendant le retour."
      : "R1 revient, mais R2 reste Master tant qu'il fonctionne : R1 devient Backup (préemption désactivée). On évite un deuxième basculement, mais le routeur préféré n'est plus Master.";
  }
  function ann() {
    if (step === 0) return "Annonces : R1 envoie (priorité 110) toutes les secondes · R2 reçoit";
    if (step === 1) return "Annonces : aucune depuis 3 s · R2 lance l'élection";
    if (step === 2) return "Annonces : R2 envoie (priorité 100) · R1 est éteint";
    return pre ? "Annonces : R1 envoie (priorité 110) · R2 reçoit et repasse Backup" : "Annonces : R2 envoie (priorité 100) · R1 reçoit et reste Backup";
  }
  function draw() {
    const r = roles();
    const PC = [55, 125], SW = [150, 125], R1 = [290, 58], R2 = [290, 192], NET = [425, 125];
    const c1 = r.act === 'r1' ? 'out' : r.r1 === 'down' ? 'fail' : '';
    const c2 = r.act === 'r2' ? 'out' : r.r2 === 'down' ? 'fail' : '';
    let l = lineSVG(PC[0], PC[1], SW[0], SW[1], r.act ? 'out' : 'waste');
    l += lineSVG(SW[0], SW[1], R1[0], R1[1], c1) + lineSVG(R1[0], R1[1], NET[0], NET[1], c1);
    l += lineSVG(SW[0], SW[1], R2[0], R2[1], c2) + lineSVG(R2[0], R2[1], NET[0], NET[1], c2);
    const sub = (role, p) => role === 'down' ? LAB[role] : `${LAB[role]} · ${p}`;
    let n = nodeSVG(PC[0], PC[1], 'PC', '', r.act ? 'on' : 'waste', 56, 34);
    n += nodeSVG(SW[0], SW[1], 'SW', '', r.act ? 'on' : '', 64, 40);
    n += nodeSVG(R1[0], R1[1], 'R1', sub(r.r1, 110), CLS[r.r1], 100, 44);
    n += nodeSVG(R2[0], R2[1], 'R2', sub(r.r2, 100), CLS[r.r2], 100, 44);
    n += nodeSVG(NET[0], NET[1], 'Internet', '', r.act ? 'on' : '', 76, 34);
    n += `<text class="sub" x="${PC[0]}" y="${PC[1] + 30}" text-anchor="middle">GW 192.168.1.1</text>`;
    el.innerHTML = `<div class="sim">
      <div class="step">Étape ${step + 1} sur 4</div>
      <svg class="map" viewBox="0 0 480 250" role="img" aria-label="${TITLES[step]}">${l}${n}</svg>
      ${legend([['--ok', "Chemin des paquets"], ['--bad', "Routeur en panne"], ['--d2', "Paquets sans réponse"]])}
      <div class="note"><b>${TITLES[step]}</b><br>${body()}</div>
      <div class="pkt"><span>${ann()}</span><span>Table ARP du PC : <b>192.168.1.1</b> = <b>00:00:5E:00:01:01</b> (MAC virtuelle, inchangée)</span></div>
      <div class="seg" role="group" aria-label="Préemption"><button data-s="pre" data-v="1" aria-pressed="${pre}">Préemption activée</button><button data-s="pre" data-v="0" aria-pressed="${!pre}">Préemption désactivée</button></div>
      <div><button class="btn" data-s="next">${step < 3 ? "Étape suivante" : "Recommencer"}</button></div></div>`;
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'next') step = step < 3 ? step + 1 : 0;
    else pre = b.dataset.v === '1';
    draw();
  });
  draw();
}

function labTopoSVG(tp) {

  const SZ = { pc: [78, 44], sw: [100, 40], r: [100, 40], l3: [112, 44] };
  const exit = (n, ux, uy) => { const s = SZ[n.t], ex = Math.abs(ux) < 1e-6 ? 1e9 : s[0] / 2 / Math.abs(ux), ey = Math.abs(uy) < 1e-6 ? 1e9 : s[1] / 2 / Math.abs(uy); return Math.min(ex, ey); };

    lines += `<line class="lk v${l.c}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    const put = (n, txt, sx) => {
      if (!txt) return;
      const lw = txt.length * 6.4; let d = exit(n, sx * ux, sx * uy) + 8 + Math.abs(ux) * lw / 2 + Math.abs(uy) * 7; if (sx === 1 && oc[n.id] >= 4) d = len * 0.42;
      labs += `<text class="pt" x="${(n.x + sx * ux * d).toFixed(1)}" y="${(n.y + sx * uy * d + 4).toFixed(1)}" text-anchor="middle">${esc(txt)}</text>`;
    };
    put(a, l.pa, 1); put(b, l.pb, -1);
    if (l.lab) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      labs += Math.abs(ux) > Math.abs(uy)
        ? `<text class="tl" x="${mx}" y="${my - 10}" text-anchor="middle">${esc(l.lab)}</text>`
        : `<text class="tl" x="${mx + 12}" y="${my + 4}">${esc(l.lab)}</text>`;
    }
  });
  tp.nodes.forEach(n => {
    const s = SZ[n.t], v = n.v ? ' v' + n.v : '';
    nodes += `<g class="nd ${n.t}${v}"><rect x="${n.x - s[0] / 2}" y="${n.y - s[1] / 2}" width="${s[0]}" height="${s[1]}" rx="${n.t === 'pc' ? 6 : 10}"/>

  });
  return `<svg class="labmap" viewBox="0 0 640 ${tp.h}" role="img" aria-label="Topologie du lab">${lines}${nodes}${labs}</svg>`;
}
